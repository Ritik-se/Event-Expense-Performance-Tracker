<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Denied | EventIQ</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin:0; font-family:'DM Sans',sans-serif; background:#F4F7FE;
               display:flex; justify-content:center; align-items:center; height:100vh; }
        .box { background:white; padding:50px; border-radius:20px;
               box-shadow:0 18px 40px rgba(112,144,176,0.12);
               text-align:center; max-width:400px; }
        h1 { color:#2B3674; font-size:28px; margin:15px 0 8px; }
        p  { color:#A3AED0; font-size:14px; margin-bottom:25px; }
        a  { background:#4318FF; color:white; padding:12px 28px; border-radius:10px;
             text-decoration:none; font-weight:600; font-size:14px; }
    </style>
</head>
<body>
    <div class="box">
        <i class="fas fa-lock" style="font-size:60px;color:#FF5B5B;"></i>
        <h1>Access Denied</h1>
        <p>You don't have permission to view this page.<br>
           Contact your administrator if you think this is a mistake.</p>
        <a href="/dashboard"><i class="fas fa-home"></i> Back to Dashboard</a>
    </div>
</body>
</html>
