<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | EventIQ</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="brand-corner"><i class="fas fa-shapes"></i> EventIQ</div>
    <div class="login-box">
        <h2>Welcome Back</h2>
        <p> Club Management Dashboard</p>
        {% if error %}
        <div style="background:#FEE2E2;color:#B91C1C;padding:10px;border-radius:8px;font-size:13px;margin-bottom:15px;">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autocomplete="username">
            <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            <button class="btn-primary" style="margin-top:15px;padding:14px;font-size:16px;">Log In Securely</button>
        </form>
        <p style="margin-top:25px;font-size:12px;color:#aaa;">
            Demo Credentials:<br>
            <b>admin</b> / <b>admin123</b> &nbsp;|&nbsp; <b>impetus</b> / <b>1234</b>
        </p>
    </div>
</body>
</html>
